name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binaries
        run: ./scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture images
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          repository="${REPOSITORY,,}"
          version="${VERSION#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$REGISTRY/$repository/webtop:$version" \
            --tag "$REGISTRY/$repository/webtop:latest" \
            --push images/webtop
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$REGISTRY/$repository/gateway:$version" \
            --tag "$REGISTRY/$repository/gateway:latest" \
            --push images/gateway
