services:
  docker:
    image: ${WKTBOX_DIND_IMAGE}
    hostname: docker
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    labels:
      io.wktbox.managed: "true"
      io.wktbox.box-id: ${WKTBOX_ID}
      io.wktbox.worktree: ${WORKTREE_PATH}
      io.wktbox.version: ${WKTBOX_VERSION}
    volumes:
      - docker-data:/var/lib/docker
      - docker-certs:/certs
      - artifacts:/artifacts
      - type: bind
        source: ${WORKTREE_PATH}
        target: /workspace
      - type: bind
        source: ${PROJECT_ENV_PATH}
        target: /workspace/.env
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          DOCKER_HOST=tcp://localhost:2376
          DOCKER_TLS_VERIFY=1
          DOCKER_CERT_PATH=/certs/client
          docker info >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 30

  webtop:
    image: ${WKTBOX_WEBTOP_IMAGE}
    depends_on:
      docker:
        condition: service_healthy
    working_dir: /workspace
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      WKTBOX_ID: ${WKTBOX_ID}
      WKTBOX_WORKSPACE: /workspace
    labels:
      io.wktbox.managed: "true"
      io.wktbox.box-id: ${WKTBOX_ID}
      io.wktbox.worktree: ${WORKTREE_PATH}
      io.wktbox.version: ${WKTBOX_VERSION}
    volumes:
      - docker-certs:/certs:ro
      - artifacts:/artifacts
      - type: bind
        source: ${WORKTREE_PATH}
        target: /workspace
      - type: bind
        source: ${PROJECT_ENV_PATH}
        target: /workspace/.env
        read_only: true
    ports:
      - 127.0.0.1:${PORT_HTTP}:3000
      - 127.0.0.1:${PORT_HTTPS}:3001
      - 127.0.0.1:${PORT_SSH}:22
    shm_size: ${SHM_SIZE}

volumes:
  docker-data:
  docker-certs:
  artifacts:
