services:
  docker:
    image: ${WKTBOX_DIND_IMAGE}
    hostname: wktbox-${WKTBOX_ID}-docker
    command:
      - /bin/sh
      - -c
      - >-
        dns_address="$$(ip -4 route get 192.0.2.1 |
        sed -n 's/.* src \([^ ]*\).*/\1/p')";
        test -n "$$dns_address";
        exec /usr/local/bin/dockerd-entrypoint.sh --dns="$$dns_address"
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    labels:
      io.wktbox.managed: "true"
      io.wktbox.box-id: ${WKTBOX_ID}
      io.wktbox.worktree: ${WORKTREE_PATH}
      io.wktbox.version: ${WKTBOX_VERSION}
    volumes:
      - docker-data:/var/lib/docker
      - docker-certs:/certs
      - artifacts:/artifacts
      - type: bind
        source: ${WORKTREE_PATH}
        target: /workspace
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          DOCKER_HOST=tcp://localhost:2376
          DOCKER_TLS_VERIFY=1
          DOCKER_CERT_PATH=/certs/client
          docker info >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 30

  interconnect:
    image: ${WKTBOX_WEBTOP_IMAGE}
    command: ["wktbox-loopback", "dns-serve"]
    network_mode: service:docker
    depends_on:
      docker:
        condition: service_healthy
    labels:
      io.wktbox.managed: "true"
      io.wktbox.box-id: ${WKTBOX_ID}
      io.wktbox.worktree: ${WORKTREE_PATH}
      io.wktbox.version: ${WKTBOX_VERSION}
    healthcheck:
      test:
        - CMD-SHELL
        - wktbox-loopback dns-probe
      interval: 3s
      timeout: 3s
      retries: 30

  webtop:
    image: ${WKTBOX_WEBTOP_IMAGE}
    depends_on:
      docker:
        condition: service_healthy
    working_dir: /workspace
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      CUSTOM_PORT: "61000"
      CUSTOM_HTTPS_PORT: "61001"
      CUSTOM_WS_PORT: "61002"
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      WKTBOX_ID: ${WKTBOX_ID}
      WKTBOX_WORKSPACE: /workspace
    labels:
      io.wktbox.managed: "true"
      io.wktbox.box-id: ${WKTBOX_ID}
      io.wktbox.worktree: ${WORKTREE_PATH}
      io.wktbox.version: ${WKTBOX_VERSION}
    volumes:
      - docker-certs:/certs:ro
      - webtop-config:/config
      - artifacts:/artifacts
      - type: bind
        source: ${WORKTREE_PATH}
        target: /workspace
    ports:
      - 127.0.0.1:${PORT_HTTP}:61000
      - 127.0.0.1:${PORT_HTTPS}:61001
    shm_size: ${SHM_SIZE}

  loopback:
    image: ${WKTBOX_WEBTOP_IMAGE}
    command: ["wktbox-loopback", "serve"]
    network_mode: service:webtop
    depends_on:
      docker:
        condition: service_healthy
      webtop:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    labels:
      io.wktbox.managed: "true"
      io.wktbox.box-id: ${WKTBOX_ID}
      io.wktbox.worktree: ${WORKTREE_PATH}
      io.wktbox.version: ${WKTBOX_VERSION}
    volumes:
      - docker-certs:/certs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wktbox-loopback status --json >/dev/null
      interval: 3s
      timeout: 3s
      retries: 30

  gateway:
    image: ${WKTBOX_GATEWAY_IMAGE}
    profiles: ["gateway"]
    depends_on:
      docker:
        condition: service_healthy
    labels:
      io.wktbox.managed: "true"
      io.wktbox.box-id: ${WKTBOX_ID}
      io.wktbox.worktree: ${WORKTREE_PATH}
      io.wktbox.version: ${WKTBOX_VERSION}
    volumes:
      - type: bind
        source: ${GATEWAY_CONFIG_PATH}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - 127.0.0.1:${PORT_GATEWAY}:8080

volumes:
  docker-data:
  docker-certs:
  webtop-config:
  artifacts:
