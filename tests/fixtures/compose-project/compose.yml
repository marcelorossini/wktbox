name: wktbox-fixture

services:
  frontend:
    image: python:3.14-alpine
    working_dir: /app
    command: ["python", "service.py", "web", "5173"]
    volumes:
      - .:/app:ro
    ports:
      - "5173:5173"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:5173/public/index.html")
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    image: python:3.14-alpine
    working_dir: /app
    command: ["python", "service.py", "http", "3000"]
    environment:
      BOX_MARKER: ${WKTBOX_TEST_MARKER:?WKTBOX_TEST_MARKER is required}
    volumes:
      - .:/app:ro
    ports:
      - "8000:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:3000")
      interval: 2s
      timeout: 2s
      retries: 30

  database:
    image: python:3.14-alpine
    working_dir: /app
    command: ["python", "service.py", "tcp", "5432", "/data/marker"]
    environment:
      BOX_MARKER: ${WKTBOX_TEST_MARKER:?WKTBOX_TEST_MARKER is required}
    volumes:
      - .:/app:ro
      - database-data:/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(("localhost",5432),2); s.close()
      interval: 2s
      timeout: 2s
      retries: 30

  e2e:
    image: python:3.14-alpine
    profiles: ["test"]
    working_dir: /app
    command: ["python", "check.py"]
    environment:
      BOX_MARKER: ${WKTBOX_TEST_MARKER:?WKTBOX_TEST_MARKER is required}
    volumes:
      - .:/app:ro
      - /artifacts:/artifacts
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      database:
        condition: service_healthy

volumes:
  database-data:
